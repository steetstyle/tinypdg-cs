name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The GitHub-source job runs on a schedule as well as on demand. It is in this file
  # rather than a separate one because GitHub only honours `schedule` for a workflow
  # whose *filename* it recognises, and putting it elsewhere means it never runs.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --features mcp-http

  # `default = []` advertises a build without the MCP server, so that build has to
  # work. It stopped working by accident once: a helper was inserted between a
  # `#[cfg(feature = "mcp")]` and the function it gated, so the attribute landed on
  # the helper and two definitions of `serve` compiled at once -- but only without
  # the feature, which is the configuration no one builds on purpose and nothing
  # checked.
  no-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: build without the mcp feature
        run: cargo build --release

      - name: test without the mcp feature
        run: cargo test

  # Fetching and searching need the network. Run on a schedule and on demand rather
  # than on every push: slow, rate limited, and a failure says something about the
  # network rather than about the code.
  #
  # The repository under test is this one. A sibling would couple the job to whether
  # that repo still exists, is still public, and still builds -- none of which is about
  # anything in this file. tiny-pdg-cs is also a valid C# target: its own fixtures are
  # real C#, so the analysis has something to find rather than reporting zero files.
  github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - env:
          # A job-scoped cache directory, so the checkout a later step inspects is
          # known rather than guessed.
          TINY_SOURCE_CACHE: ${{ github.workspace }}/.source-cache
        run: |
          set -eu
          cargo build --release

          # No token on purpose: a public repository has to resolve without one, and a
          # token in CI would hide that regression.
          unset GITHUB_TOKEN TINY_GITHUB_TOKEN

          echo "::group::a branch resolves"
          ./target/release/tiny-pdg-cs detect gh:steetstyle/tinypdg-cs@main

          echo "::group::a commit resolves to exactly that commit"
          SHA=$(git ls-remote https://github.com/steetstyle/tinypdg-cs main | cut -f1)
          ./target/release/tiny-pdg-cs detect "gh:steetstyle/tinypdg-cs@$SHA"

          # Exit code alone would not catch a commit checkout that silently landed on
          # the branch head: the two produce identical output while the repository is
          # unchanged, which is exactly the case that matters.
          #
          # The path comes from `where`, which answers whether or not it had to fetch.
          # Reading it out of detect's output was the previous way and it was wrong in a
          # way that only CI could hit: `announce` says nothing on a cache hit, on
          # purpose, so the second call for a reference -- which the step above has
          # already fetched -- reported no path at all. `where` is asked the question
          # directly instead of inferred from a message that was never going to come.
          #
          # Not a glob: the cache directory is a readable prefix plus a hash of the full
          # reference, and the readable part is truncated, so a glob on the sha does not
          # match -- a failure that only shows up once the sha is long enough.
          DIR=$(./target/release/tiny-pdg-cs where "gh:steetstyle/tinypdg-cs@$SHA")
          if [ -z "$DIR" ]; then
            echo "the tool did not report where it fetched to"
            exit 1
          fi
          ACTUAL=$(git -C "$DIR" rev-parse HEAD)
          if [ "$ACTUAL" != "$SHA" ]; then
            echo "checkout is at $ACTUAL, not the requested $SHA"
            exit 1
          fi
          echo "pinned to $ACTUAL"

          echo "::group::a subdirectory narrows to it"
          ./target/release/tiny-pdg-cs detect "gh:steetstyle/tinypdg-cs@$SHA:tests/fixtures/hammock"

          echo "::group::repository search works without a token"
          ./target/release/tiny-pdg-cs search tinypdg-cs --kind repositories --limit 3
