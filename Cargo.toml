[package]
name = "tiny-pdg-cs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C# Program Dependence Graph (PDG) builder with tree-sitter, DI/Reflection call resolution, and hammock-block analysis"

[dependencies]
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP server (`tiny-pdg-cs serve`). Gated so the library stays usable without a
# tokio runtime or an MCP stack; every MCP tool is also available via the CLI.
# `server` + `transport-io` give stdio; `transport-streamable-http-server` adds
# Streamable HTTP. The standalone SSE transport is deprecated in the MCP spec and
# the SDK ships no server for it, so there is nothing to enable here.
rmcp = { version = "3", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
# Serving the Streamable HTTP tower service needs an HTTP server to host it.
axum = { version = "0.8", optional = true }
# Tool parameter schemas. Must match the version rmcp re-exports (1.x for
# rmcp 3.5) — pinning 0.8 here makes the derive produce a different crate's
# trait and the tool bounds never resolve.
schemars = { version = "1", optional = true }
# GitHub search. Blocking rather than async because every tool in this crate is a
# plain `fn` -- the MCP handlers are synchronous, so an async client would mean
# plumbing tokio through a crate that only needs it under a feature flag.
# rustls rather than native-tls so a build does not need OpenSSL headers present.
ureq = { version = "3", default-features = false, features = ["json", "rustls", "gzip"] }

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]
mcp-http = ["mcp", "rmcp/transport-streamable-http-server", "dep:axum"]

# The HTTP transport test needs the transport. Without `required-features` the target is
# compiled by a bare `cargo test` and fails with "could not find `streamable_http_server`
# in `transport`" -- which is how the no-mcp job went red on every push while nothing
# else in the repository had changed.
[[test]]
name = "mcp_http_test"
required-features = ["mcp-http"]

# Drives `tiny-pdg-cs serve` as a subprocess rather than linking the router, so it compiles
# without the feature and then fails: the spawned server exposes no tools, and the six
# tests report "server closed the stream before responding". Same declaration needed for
# the same reason as the target above.
[[test]]
name = "mcp_server_test"
required-features = ["mcp"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
pretty_assertions = "1"
# The HTTP test drives the server with the official SDK client as well as by
# hand, so the client transport must be available to the test build.
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }

[[bench]]
name = "bench_pdg"
path = "benches/bench_pdg.rs"
harness = false
