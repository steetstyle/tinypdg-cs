[package]
name = "tiny-pdg-cs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C# Program Dependence Graph (PDG) builder with tree-sitter, DI/Reflection call resolution, and hammock-block analysis"

[dependencies]
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP server (`tiny-pdg-cs serve`). Gated so the library stays usable without a
# tokio runtime or an MCP stack; every MCP tool is also available via the CLI.
rmcp = { version = "3", features = ["server", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
# Tool parameter schemas. Must match the version rmcp re-exports (1.x for
# rmcp 3.5) — pinning 0.8 here makes the derive produce a different crate's
# trait and the tool bounds never resolve.
schemars = { version = "1", optional = true }

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
pretty_assertions = "1"

[[bench]]
name = "bench_pdg"
path = "benches/bench_pdg.rs"
harness = false